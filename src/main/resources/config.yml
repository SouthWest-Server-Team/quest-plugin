# 最大驳回次数
max-rejects: 5
# 发布者取消已接取委托的罚款倍率
cancel-penalty-publisher: 0.5
# 接收方取消委托的罚款倍率
cancel-penalty-acceptor: 3.0
# 委托接取期限（天）
accept-deadline-days: 7
# 委托完成期限（天）
complete-deadline-days: 7
# 显示告示牌轮换间隔（秒）
board-rotation-seconds: 30
# 热卖加权: 剩余小于此小时数的委托获得最大展示次数
board-urgent-hours: 1
# 热卖加权: 剩余小于此小时数的委托获得中等展示次数
board-warn-hours: 24
# 热卖加权: 紧急委托的队列副本数
board-urgent-copies: 3
# 热卖加权: 预警委托的队列副本数
board-warn-copies: 2
# CasusBelli 违约检测对账间隔（秒）。
# 检测由委托数据变更唤醒，且只在存在「已接取的城邦委托」时才轮询；没有此类委托时完全停止轮询。
# 对账是电平式的（每次重新读当前战争状态），不会漏掉战争状态变化，间隔只影响发现延迟。
war-violation-check-seconds: 60
